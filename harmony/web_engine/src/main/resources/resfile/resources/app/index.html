<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>EditLedger</title><link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css"><link rel="stylesheet" href="workspace.css"></head><body>
<aside><div class="brand">EL<span>EditLedger</span></div><p class="eyebrow">本地文稿工作台</p><button id="new">＋ 新建文稿</button><h2>已保存的文件</h2><div id="files"></div><p class="side-note">文稿保存在应用自有目录。<br>选择文件即可重新打开。</p><button id="btn-release-notices">隐私与许可</button></aside>
<main><header><div><p class="eyebrow">WRITE · EDIT · KEEP</p><h1>把想法写下来</h1></div><span id="dirty">新文稿</span></header><section class="toolbar"><label>文件名<input id="filename" value="notes.txt" maxlength="100"></label><button id="save" class="primary">保存文稿</button><button id="reopen">重新打开</button><label>语法<select id="syntax"><option value="text/plain">纯文本</option><option value="javascript">JavaScript</option><option value="python">Python</option><option value="markdown">Markdown</option><option value="css">CSS</option></select></label></section>
<section class="format"><label>编码<select id="encoding"><option value="utf8">UTF-8</option><option value="utf16le">UTF-16 LE</option><option value="utf16be">UTF-16 BE</option></select></label><label><input id="bom" type="checkbox"> BOM</label><label>换行<select id="eol"><option value="lf">LF</option><option value="crlf">CRLF</option><option value="cr">CR</option></select></label><span id="format-note">UTF-8 · LF</span></section>
<section class="search" aria-label="编辑命令"><button id="edit-select-all">全选</button><button id="edit-copy">复制</button><button id="edit-cut">剪切</button><button id="edit-paste">粘贴</button></section><section class="search"><label>查找<input id="find" placeholder="查找文本"></label><label>替换为<input id="replace" placeholder="替换文本"></label><button id="find-next">查找下一处</button><button id="replace-all">全部替换</button></section>
<div id="editor-host"><textarea id="editor" aria-label="文稿正文"></textarea></div><footer><span id="status" role="status">准备就绪</span><span id="position">第 1 行 · 第 1 列</span></footer></main>
<script src="vendor/codemirror/lib/codemirror.js"></script><script src="vendor/codemirror/mode/javascript/javascript.js"></script><script src="vendor/codemirror/mode/python/python.js"></script><script src="vendor/codemirror/mode/markdown/markdown.js"></script><script src="vendor/codemirror/mode/css/css.js"></script><script src="workspace.js"></script><div id="release-notice-dialog" role="dialog" aria-modal="true" aria-label="EditLedger 隐私与许可" style="display:none;position:fixed;inset:5%;z-index:10000;background:#fff;border:2px solid #91afc0;padding:22px;color:#203c48;flex-direction:column;gap:12px"><h2>EditLedger 1.0.2 · 隐私与许可</h2><div><button id="release-notice-main">隐私与许可</button> <button id="release-notice-credits">完整运行时告知</button> <button id="release-notice-prev">上一页</button> <button id="release-notice-next">下一页</button> <button id="release-notice-last">末页</button> <span id="release-notice-page"></span> <button id="release-notice-close">关闭</button></div><pre id="release-notice-text" tabindex="0" style="flex:1;overflow:auto;white-space:pre-wrap;font:16px/1.6 sans-serif"></pre></div><script src="release-notices.js"></script></body></html>
